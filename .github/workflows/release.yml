name: Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI push run ID containing the tested build
        required: true
        type: string
      tag:
        description: New version tag (for example v0.1.0 or v0.2.0-beta.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      # Do not check out or execute code from the selected build.
      - name: Validate build and verify downloaded assets
        id: build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid run ID" >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]] || { echo "Invalid version tag" >&2; exit 1; }

          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          jq -e --arg repo "$GH_REPO" '
            .event == "push" and .status == "completed" and .conclusion == "success"
            and .path == ".github/workflows/ci.yml"
            and .head_repository.full_name == $repo
          ' run.json > /dev/null
          build_sha=$(jq -r '.head_sha' run.json)
          [[ "$build_sha" =~ ^[0-9a-f]{40}$ ]]

          # The tag must name the version the build commit's Cargo.toml declares.
          cargo_version=$(gh api "repos/$GH_REPO/contents/Cargo.toml?ref=$build_sha" \
            -H "Accept: application/vnd.github.raw" \
            | awk '{ sub(/\r$/, "") } /^\[/ { in_package = ($0 == "[package]") } in_package && /^version *=/ { gsub(/[" ]/, "", $0); sub(/^version=/, "", $0); print; exit }')
          [[ -n "$cargo_version" ]] || { echo "Could not read the version from Cargo.toml at $build_sha" >&2; exit 1; }
          [[ "${RELEASE_TAG#v}" == "$cargo_version" ]] || {
            echo "Tag $RELEASE_TAG does not match version $cargo_version in Cargo.toml at $build_sha" >&2
            exit 1
          }

          # The app verifies updates against the key at this path in its own build, so the
          # signature is checked against the build commit's copy.
          gh api "repos/$GH_REPO/contents/release.pub?ref=$build_sha" \
            -H "Accept: application/vnd.github.raw" > release.pub

          gh run download "$BUILD_RUN_ID" --name hindsight-windows-x64 --dir release
          for asset in hindsight-setup-x64.exe hindsight-windows-x64.zip SHA256SUMS.txt release-notes.md; do
            gh attestation verify "release/$asset" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/ci.yml" \
              --source-digest "$build_sha" --deny-self-hosted-runners
          done

          # The release notes are the CHANGELOG.md section the build embedded in the app.
          notes=$(cat release/release-notes.md)
          [[ -n "$notes" ]] || { echo "The build at $build_sha carries no release notes" >&2; exit 1; }

          echo "sha=$build_sha" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n\n' "$notes"
            echo "Built from commit $build_sha."
            echo
            echo "Build: https://github.com/$GH_REPO/actions/runs/$BUILD_RUN_ID"
            echo
            echo 'Verify the installer with GitHub CLI:'
            echo '```bash'
            printf 'gh attestation verify hindsight-setup-x64.exe --repo %s --signer-workflow %s/.github/workflows/ci.yml --source-digest %s\n' "$GH_REPO" "$GH_REPO" "$build_sha"
            echo '```'
          } > release-notes.md

      # The app installs an update only when this signature verifies against the public key it
      # carries, and only for the installer and version named in the trusted comment.
      - name: Sign the installer for in-app updates
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$MINISIGN_SECRET_KEY" ]] || { echo "The MINISIGN_SECRET_KEY secret is not set" >&2; exit 1; }
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends minisign

          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m release/hindsight-setup-x64.exe \
            -t "hindsight-setup-x64.exe ${RELEASE_TAG#v}"
          minisign -V -p release.pub -m release/hindsight-setup-x64.exe

      - name: Tag the build commit and create a draft
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Creating a new ref fails if the tag exists; never move an existing tag.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$BUILD_SHA"

          # A tag with a pre-release suffix is marked as one, so that the app's update check,
          # which follows the latest release, never offers it.
          prerelease=()
          [[ "$RELEASE_TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$RELEASE_TAG" \
            release/hindsight-setup-x64.exe \
            release/hindsight-setup-x64.exe.minisig \
            release/hindsight-windows-x64.zip \
            release/SHA256SUMS.txt \
            --verify-tag --draft --title "hindsight $RELEASE_TAG" \
            --notes-file release-notes.md "${prerelease[@]}"
