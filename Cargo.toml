[package]
name = "hindsight"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "The lowest-overhead instant replay for Windows: captured and encoded on the GPU, no overlay, no launcher, no bloat"
repository = "https://github.com/malinoskj2/hindsight"
license = "BSD-2-Clause"
publish = false

[dependencies]
anyhow = "1"
bitstream-io = "4"
hound = "3.5"
mp4-atom = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
clap = { version = "4.5", features = ["derive"] }
ico = { version = "0.6", default-features = false }
tray-icon = { version = "0.26", default-features = false }
winreg = "0.56"
winsafe = { version = "0.0.29", default-features = false, features = ["dwm", "gdi", "gui", "user", "winmm"] }
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
png = { version = "0.18", default-features = false }
# The `implement` macro behind the audio device listener names this crate directly.
windows-core = "0.62"

[target.'cfg(not(windows))'.dependencies]
jiff = { version = "0.2", default-features = false, features = ["std"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

# Only the D3D12 encode cost test in `src/gpu/nvenc/d3d12_cost.rs` needs these bindings.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D12", "Win32_System_WindowsProgramming"] }

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Prefer direct assignment when reusing an allocation would obscure the intent.
assigning_clones = "allow"
redundant_pub_crate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
